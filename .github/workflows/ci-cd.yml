name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Global configuration: minimal exposure
env:
  AWS_REGION: us-west-2
  NODE_VERSION: '20'
  TF_VAR_allowed_ssh_cidr: ${{ secrets.ALLOWED_SSH_CIDR }}
  TF_VAR_environment: "dev"
  TF_VAR_frontend_bucket_name: "my-demo-app-frontend-dev"
  TF_VAR_key_pair_name: "my-demo-app-key"
  TF_VAR_github_repo: "https://github.com/Kishan-Zalavadia/Pipeline-Setup.git"


# Permissions for AWS OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  # LINT & FORMAT: Ensure code quality before any other action
  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Check Formatting (Prettier)
        run: npm run format:check

  # BUILD: Prepare frontend assets
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend Application
        run: npm run build --workspace=frontend

      - name: Export Build Artifacts
        uses: actions/upload-artifact@v4

        with:
          name: frontend-build
          path: frontend/dist

  # TERRAFORM: Provison/Update Infrastructure
  terraform:
    name: Infrastructure Management
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    outputs:
      s3_bucket_name: ${{ steps.exports.outputs.s3_bucket_name }}
      frontend_url: ${{ steps.exports.outputs.frontend_url }}
      backend_url: ${{ steps.exports.outputs.backend_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          output-env-credentials: true

      - name: Initialize Terraform
        run: |
          cd terraform/dev
          terraform init -reconfigure

      - name: Create Execution Plan
        run: |
          cd terraform/dev
          terraform plan -out=tfplan

      - name: Apply Infrastructure Changes
        run: |
          cd terraform/dev
          terraform apply -auto-approve tfplan

      - name: Capture Output Variables
        id: exports
        run: |
          cd terraform/dev
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"
          echo "backend_url=$(terraform output -raw backend_url)" >> "$GITHUB_OUTPUT"

  # DEPLOY: Sync assets to S3
  deploy-frontend:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: [build, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          output-env-credentials: true

      - name: Sync Frontend to S3 Bucket
        run: |
          aws s3 sync frontend/dist s3://${{ needs.terraform.outputs.s3_bucket_name }} \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Frontend deployment summary
        run: |
          echo "✅ Frontend deployed successfully"
          echo "URL: https://${{ env.frontend_bucket_name}}.s3.amazonaws.com"

  deployment-summary:
    name: Final Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend, terraform]
    if: always()
    steps:
      - name: Post Deployment Report
        run: |
          echo "🚀 DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "-------------------------------------"
          echo "✅ Infrastructure Status: ${{ needs.terraform.result }}"
          echo "✅ Frontend Deploy Status: ${{ needs.deploy-frontend.result }}"
          echo "-------------------------------------"
          echo "🌍 ACCESS YOUR APPLICATION:"
          echo "Frontend: ${{ needs.terraform.outputs.frontend_url }}"
          echo "Backend API: ${{ needs.terraform.outputs.backend_url }}"
          echo "-------------------------------------"
